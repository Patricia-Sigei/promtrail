server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://cloudops-loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: cloudops-api
    static_configs:
      - targets:
          - localhost
        labels:
          job: cloudops-api
          __path__: /var/log/api/*.log